name: Validate EVHunter
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: evhunter
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: evhunter_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U evhunter"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install -c backend/requirements.lock -e './backend[dev]'
      - run: python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://evhunter:ci-only-password@localhost:5432/evhunter_test
          TEST_REDIS_URL: redis://localhost:6379/0
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm audit --omit=dev --audit-level=high
